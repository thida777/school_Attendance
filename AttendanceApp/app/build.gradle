plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.school.attendance'
    compileSdk 35

    defaultConfig {
        applicationId "com.school.attendance"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing key: settings in AttendanceApp/keystore.properties (not on GitHub).
    // Without that file, the release APK is built unsigned and the project still opens normally.
    def keystoreFile = rootProject.file('keystore.properties')
    def keystore = new Properties()
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystore.load(it) }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Talk to the Laravel API (same libraries as in class: Ch9RetrofitSDemo)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.9.1'

    // Pull down to refresh, and load profile photos from the server
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}