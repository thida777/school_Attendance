<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password · Student Attendance</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';</script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-base-200" data-page="forgot-password">
<div class="flex min-h-screen flex-col p-6">
  <div class="flex justify-end gap-1">
    <button class="btn btn-ghost btn-sm" data-action="lang"></button>
    <button class="btn btn-ghost btn-sm btn-square" data-action="theme" aria-label="switch theme"></button>
  </div>

  <div class="flex grow items-center justify-center">
    <div class="card bg-base-100 border-base-300 w-full max-w-sm border">
      <!-- Step 1: ask for the email -->
      <form class="card-body" id="reset-form">
        <span class="brand-mark text-primary-content grid size-12 place-items-center rounded-2xl"><i data-lucide="key-round" class="size-6"></i></span>
        <h2 class="mt-2 text-2xl font-semibold" data-km="ភ្លេចពាក្យសម្ងាត់">Forgot password</h2>
        <p class="grow-0 text-sm opacity-60" data-km="បញ្ចូលអ៊ីមែលរបស់អ្នក យើងនឹងផ្ញើតំណដើម្បីកំណត់ពាក្យសម្ងាត់ថ្មី។">Enter your email and we will send you a link to set a new password.</p>

        <fieldset class="fieldset mt-2">
          <legend class="fieldset-legend" data-km="អ៊ីមែល">Email</legend>
          <label class="input validator w-full">
            <i data-lucide="mail" class="size-4 opacity-50"></i>
            <input type="email" placeholder="admin@school.edu.kh" required />
          </label>
          <p class="validator-hint hidden" data-km="សូមបញ្ចូលអ៊ីមែលត្រឹមត្រូវ">Enter a valid email address</p>
        </fieldset>

        <button class="btn btn-primary mt-4 w-full" data-km="ផ្ញើតំណ">Send reset link</button>
        <a href="login.html" class="btn btn-ghost w-full">
          <i data-lucide="arrow-left" class="size-4"></i><span data-km="ត្រឡប់ទៅចូលប្រើ">Back to log in</span>
        </a>
      </form>

      <!-- Step 2: link sent -->
      <div class="card-body hidden items-center text-center" id="reset-sent">
        <span class="bg-success/10 text-success grid size-14 place-items-center rounded-full"><i data-lucide="mail-check" class="size-7"></i></span>
        <h2 class="mt-2 text-xl font-semibold" data-km="សូមពិនិត្យអ៊ីមែលរបស់អ្នក">Check your email</h2>
        <p class="text-sm opacity-70" data-km="យើងបានផ្ញើតំណកំណត់ពាក្យសម្ងាត់ថ្មី។ តំណនេះមានសុពលភាព ៦០ នាទី។">We sent a link to set a new password. The link works for 60 minutes.</p>
        <a href="login.html" class="btn btn-primary mt-4 w-full" data-km="ត្រឡប់ទៅចូលប្រើ">Back to log in</a>
      </div>
    </div>
  </div>
</div>

<script src="assets/km.js"></script>
<script src="assets/app.js"></script>
<script>
  // Laravel: this form posts to the password.email route.
  document.getElementById('reset-form').addEventListener('submit', (e) => {
    e.preventDefault();
    e.target.classList.add('hidden');
    document.getElementById('reset-sent').classList.remove('hidden');
  });
</script>
</body>
</html>
